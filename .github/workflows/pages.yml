name: Build and deploy static GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate static diary pages, galleries and sitemap
        shell: pwsh
        run: ./scripts/update-seo.ps1
      - name: Check generated pages and links
        shell: pwsh
        run: ./scripts/test-seo.ps1
      - name: Prepare static website files
        shell: pwsh
        run: ./scripts/prepare-pages.ps1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

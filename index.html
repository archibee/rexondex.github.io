<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="description" content="REXONDEX 날짜 기반 디지털 아카이브">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>rexondex Archive</title>
  <script>
    (() => {
      const saved = localStorage.getItem('archive-theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved === 'dark' || (saved === 'system' && systemPrefersDark) ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0f1115' : '#f5f6f8');
    })();
  </script>
  <script src="./database.js"></script>
  <script src="./pictures.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>
  <noscript>이 아카이브를 열려면 JavaScript를 활성화해주세요.</noscript>
  <script src="./app.js"></script>
</body>
</html>
